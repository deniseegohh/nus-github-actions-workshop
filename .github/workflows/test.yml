# Runs the frontend (JavaScript) tests on every push to main or starter
# and on every pull request targeting those branches.

name: Frontend Tests # This is the name of the workflow, which will appear in the GitHub Actions UI.

on: # This section defines the events that will trigger the workflow. In this case, it will run on both 'push' and 'pull_request' events.
  push:
    branches: [main, starter] # This specifies that the workflow should run whenever there is a push to the 'main' or 'starter' branches.
  pull_request:
    branches: [main, starter] # This specifies that the workflow should run whenever there is a pull request targeting the 'main' or 'starter' branches.

jobs: # This section defines the jobs that will be run as part of the workflow. Each job can have its own set of steps and runs on a specified environment.
  test-frontend: # This is the name of the job, which will appear in the GitHub Actions UI.
    runs-on: ubuntu-latest # This specifies that the job should run on the latest version of Ubuntu available in GitHub Actions.

    steps: # This section defines the individual steps that will be executed as part of the job. Each step can run a command or use an action.
      - uses: actions/checkout@v4 # This step uses the 'actions/checkout' action to check out the repository's code so that it can be used in subsequent steps. need it in every actions probably

      - name: Set up Node.js 
        uses: actions/setup-node@v4 # This step uses the 'actions/setup-node' action to set up a Node.js environment. The 'with' section specifies the version of Node.js to use.
        with:
          node-version: "20"

      - name: Run frontend tests
        run: node --test tests/test_logic.js # This step runs the frontend tests using the Node.js command. The '--test' flag tells Node.js to run the specified test file, which in this case is 'tests/test_logic.js'.
